# Konfiguracija servera
spring.application.name=iis
server.port=8080

spring.sql.init.encoding=UTF-8
jwt.secret=yoursecuresecretkeywhichissolovelyyoursecuresecretkeywhichissolovely
jwt.expiration=86400000

#Konfiguracije baze podataka
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iis_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Pretraga / Elastic sinhronizacija
search.service.base-url=${SEARCH_SERVICE_BASE_URL:http://localhost:8081}
search.sync.enabled=${SEARCH_SYNC_ENABLED:true}
search.sync.cron=${SEARCH_SYNC_CRON:0 */2 * * * *}
search.sync.ocr-enabled=${SEARCH_SYNC_OCR_ENABLED:true}

# JPA/Hibernate konfiguracija
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Inicijalizacija podataka
#  - Da prokrene data.sql svaki put
spring.sql.init.mode=always
#  - Da napravi tabele pre nego sto pokusa da unese vrednosti
spring.jpa.defer-datasource-initialization=true

# Flyway podesavanja
spring.flyway.enabled=false